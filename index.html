<style>
/* Layout: one phone-width column. The hero is a dark rubber gym mat with a bumper plate; progress is drawn as plates in competition colours (red 25, blue 20, yellow 15, green 10). Bottom tab bar. */
:root{
  --bg:#ECEEF0; --surface:#FFFFFF; --ink:#14171C; --muted:#59626D; --line:#D5D9DE; --soft:#E3E6EA;
  --red:#D13A2C; --blue:#2356A5; --yellow:#DDA81C; --green:#2E8753; --on-red:#FFFFFF;
  --mat:#1A1D22; --mat-2:#23272D; --mat-ink:#F3F4F5; --mat-muted:#A5ACB5; --mat-line:#33383F;
  --fig-far:#A3AAB3; --fig-prop:#C3C9D0;
  --display:"Big Shoulders Display","Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1013; --surface:#171A1F; --ink:#ECEEF0; --muted:#98A1AC; --line:#2A2F36; --soft:#20242A;
  --red:#EE4F3D; --blue:#5D8FE2; --yellow:#F0C23E; --green:#4AB176; --on-red:#FFFFFF;
  --mat:#1D2126; --mat-2:#262A31; --mat-ink:#F3F4F5; --mat-muted:#A5ACB5; --mat-line:#353A42;
  --fig-far:#5C646E; --fig-prop:#3B424B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#171A1F; --ink:#ECEEF0; --muted:#98A1AC; --line:#2A2F36; --soft:#20242A;
  --red:#EE4F3D; --blue:#5D8FE2; --yellow:#F0C23E; --green:#4AB176; --on-red:#FFFFFF;
  --mat:#1D2126; --mat-2:#262A31; --mat-ink:#F3F4F5; --mat-muted:#A5ACB5; --mat-line:#353A42;
  --fig-far:#5C646E; --fig-prop:#3B424B;
  color-scheme:dark}

html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.wrap.ob{padding-block:18px 40px}

.eyebrow{font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.display{font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:.92;text-transform:uppercase}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.muted{color:var(--muted)}
.small{font-size:14px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello{display:flex;flex-direction:column;gap:2px;min-width:0}
.hello h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase}

/* segmented control */
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px;flex:none}
.seg button{font-family:var(--label);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:999px;color:var(--muted);transition:background .4s,color .4s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* hero mat */
.mat{position:relative;overflow:hidden;background:var(--mat);color:var(--mat-ink);border-radius:22px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;isolation:isolate}
.mat::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.4px);background-size:7px 7px;z-index:-1;pointer-events:none}
.mat .eyebrow{color:var(--mat-muted)}
.mat .plate-bg{position:absolute;right:-70px;top:-60px;width:230px;height:230px;z-index:-1;opacity:.95}
.mat h2{font-size:clamp(44px,13vw,64px);max-width:78%}
.mat .meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--label);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--mat-line);color:var(--mat-ink);background:var(--mat-2)}
.moves-peek{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--mat-line)}
.moves-peek div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--mat-line);font-size:15px}
.moves-peek span:last-child{color:var(--mat-muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 22px;border-radius:14px;font-family:var(--label);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;transition:transform .2s,background .3s}
.btn:active{transform:scale(.98)}
.btn.go{background:var(--red);color:var(--on-red)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.mat .btn.ghost{border-color:var(--mat-line);color:var(--mat-ink)}
.btn.full{width:100%}
.btn.sm{min-height:42px;font-size:16px;padding:0 16px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 0;min-width:0}
.linkish{font-family:var(--label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);font-size:15px;padding:6px 0}

/* cards */
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.card h3{font-family:var(--label);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* week plates */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--label);font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.week .d.today{color:var(--ink)}
.pl{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);position:relative}
.pl.on{border:0;background:radial-gradient(circle at 50% 50%,var(--mat) 0 15%,transparent 16%),radial-gradient(circle,var(--pc) 0 100%)}
.pl.on::after{content:"";position:absolute;inset:22%;border-radius:50%;border:1.5px solid rgba(255,255,255,.35)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .num{font-size:32px}
.stat .num small{font-family:var(--label);font-size:15px;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:.04em}

.tip{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.tip .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--yellow);margin-top:7px}

/* plan list */
.wk{display:flex;flex-direction:column;gap:10px}
.wk-item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.wk-item:first-of-type{border-top:0}
.wk-item .nm{font-weight:600;min-width:0}
.wk-item .rx{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;font-size:15px}
.tag{font-family:var(--label);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.next{background:var(--red);color:var(--on-red)}
.tag.up{background:transparent;border:1px solid var(--green);color:var(--green)}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-family:var(--label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted);min-width:0}
input.in,select.in{width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
input.in.txt{font-family:var(--body);font-weight:600;font-size:18px}
input.in:focus{border-color:var(--blue);outline:none}
.unit{position:relative}
.unit input{padding-right:52px}
.unit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-family:var(--label);font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.err{color:var(--red);font-size:14px;font-weight:600}

.choice{display:grid;gap:10px}
.choice.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;transition:border-color .3s,background .3s;min-width:0}
.opt b{font-family:var(--label);font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.opt span{color:var(--muted);font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.opt .ico{width:38px;height:38px;margin-bottom:6px;color:var(--ink)}
.opt.big{padding:18px 14px}

.days{display:flex;gap:8px}
.days button{flex:1;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:800;font-size:24px}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* onboarding */
.ob-hero{position:relative;background:var(--mat);color:var(--mat-ink);border-radius:24px;padding:28px 20px 22px;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:14px}
.ob-hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.4px);background-size:7px 7px;z-index:-1}
.ob-hero h1{font-family:var(--display);font-weight:900;font-size:clamp(56px,17vw,92px);line-height:.86;text-transform:uppercase}
.ob-hero h1 em{font-style:normal;color:var(--red)}
.ob-hero p{color:var(--mat-muted);max-width:30ch;font-size:17px}
.ob-hero .bar{position:relative;height:120px;margin:4px -20px 0}
.ob-steps{display:flex;gap:6px}
.ob-steps i{flex:1;height:4px;border-radius:4px;background:var(--line);transition:background .6s}
.ob-steps i.on{background:var(--red)}
.ob-q{font-family:var(--display);font-weight:800;font-size:40px;line-height:.95;text-transform:uppercase}
.bmi{display:flex;flex-direction:column;gap:8px}
.bmi-scale{position:relative;height:10px;border-radius:10px;background:linear-gradient(90deg,var(--blue) 0 14%,var(--green) 14% 40%,var(--yellow) 40% 60%,var(--red) 60% 100%);opacity:.85}
.bmi-scale i{position:absolute;top:-5px;width:4px;height:20px;border-radius:3px;background:var(--ink);transform:translateX(-2px)}
.bmi-lbl span{position:absolute;transform:translateX(-50%)}.bmi-lbl span:first-child{transform:none}.bmi-lbl span:last-child{transform:translateX(-100%)}
.bmi-lbl{position:relative;height:16px;font-family:var(--label);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--red)}

/* sparkline */
.spark{width:100%;height:56px;display:block}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hist div:first-child{border-top:0}
.hist .when{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* player */
.player{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.p-in{max-width:540px;min-height:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.p-prog{display:flex;gap:4px;flex:1}
.p-prog i{flex:1;height:5px;border-radius:5px;background:var(--line);transition:background .8s}
.p-prog i.done{background:var(--ink)}
.p-prog i.now{background:var(--red)}
.x{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.x svg{width:20px;height:20px}
.p-name{font-family:var(--display);font-weight:900;font-size:clamp(46px,14vw,72px);line-height:.88;text-transform:uppercase}
.p-target{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.p-target .num{font-size:88px}
.p-target .u{font-family:var(--label);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cues{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.cues li{display:flex;gap:10px;font-size:17px}
.cues li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:9px}
.setdots{display:flex;gap:8px;align-items:center}
.setdots i{width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:block}
.setdots i.done{border:0;background:radial-gradient(circle,var(--mat) 0 16%,transparent 17%),var(--red)}
.setdots i.now{border:2px solid var(--red)}
.swap{display:flex;gap:8px;flex-wrap:wrap}
.swap button{font-family:var(--label);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.swap button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.load{display:flex;align-items:center;gap:10px}
.load .in{text-align:center;flex:1}
.load .step{width:52px;height:52px;border-radius:12px;background:var(--soft);font-family:var(--display);font-weight:800;font-size:28px;flex:none}
.hint{font-size:14px;color:var(--green);font-weight:600}
.ring-wrap{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:6px auto 0;max-width:100%}
.ring-wrap svg{width:100%;height:100%;display:block}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.ring-c .num{font-size:96px;color:var(--mat-ink)}
.ring-c .eyebrow{color:var(--mat-muted)}
.ring-arc{transition:stroke-dashoffset .3s linear}
.p-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.next-up{font-size:16px;text-align:center;color:var(--muted)}
.next-up b{color:var(--ink)}
.wlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.wlist div{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:17px}
.wlist div.now{font-weight:700}
.wlist div.now span:first-child{color:var(--red)}
.wlist div.done{color:var(--muted);text-decoration:line-through}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feel button{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.feel button b{font-family:var(--label);font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.feel button span{font-size:13px;color:var(--muted);text-align:center}
.feel button[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.confirm{background:var(--surface);border:1.5px solid var(--red);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.p-show{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.fig-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 4px 2px;min-width:0}
.fig-card svg,.thumb svg{display:block;width:100%;height:auto}
.fig-card.solo{max-width:360px;margin:0 auto;width:100%}
.thumb{flex:none;width:58px;background:var(--soft);border-radius:10px;padding:2px}
.vid{display:inline-flex;align-items:center;gap:8px;font-family:var(--label);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);text-decoration:none;padding:4px 0}
.vid svg{width:18px;height:18px}
.code{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.06em;font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all;word-break:break-all}
.ok-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}
.ok-dot.off{background:var(--yellow)}
@media (max-width:360px){.p-show{grid-template-columns:1fr}}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--red) 22%,var(--bg))}100%{background:var(--bg)}}
.fade{animation:fadeIn .9s ease both}
@keyframes fadeIn{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;box-shadow:0 4px 18px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.p-target .num{font-size:72px}.stat .num{font-size:26px}.seg button{padding:8px 10px}}
</style>

async function initClaudeDb(){
  if(!window.claude || typeof window.claude.use!=="function") return false;
  try{
    const [db,user] = await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return false;
    const uid = await user.id();
    if(!uid) return false;
    const ref = db.doc("data/users/"+uid+"/state");
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    let writing = Promise.resolve();
    cloud = {kind:"claude",save:(d)=>{writing = writing.then(()=>ref.set(d)).catch(()=>{});return writing}};
    if(remote && adopt(remote)) render();
    else if(S.profile && (!remote || (remote.updatedAt||0) < S.updatedAt)) cloud.save(packed());
    render();
    return true;
  }catch(e){return false}
}

let figRAF=null;
const easeIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function phaseK(p){return p<.1?0:p<.5?easeIO((p-.1)/.4):p<.6?1:1-easeIO((p-.6)/.4)}
function animateFigs(){
  cancelAnimationFrame(figRAF);
  const els=[...document.querySelectorAll("svg[data-fig]")];if(!els.length)return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){els.forEach(el=>el.innerHTML=figInner(el.dataset.fig,1));return}
  const t0=performance.now();let last=0;
  const loop=now=>{
    if(!els[0].isConnected)return;
    if(now-last>32){last=now;const k=phaseK(((now-t0)/3600)%1);els.forEach(el=>el.innerHTML=figInner(el.dataset.fig,k))}
    figRAF=requestAnimationFrame(loop);
  };
  figRAF=requestAnimationFrame(loop);
}

      return `<div class="wk-item"><div class="thumb">${figSVG(id,1)}</div><div class="nm" style="flex:1">${esc(exName(id))}<div class="small muted">${esc(EX[id].m)}${EX[id].load&&S.lifts[id]?" · last "+fmtW(S.lifts[id]):""}</div></div>
      <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="rx">${rxText(id)}</span>${up?`<span class="tag up">${EX[id].load&&S.up[id]?"Add weight":"Ready to level up"}</span>`:""}</div></div>`}).join("")}</div>
    <button class="btn ${i===nx?"go":"ghost"} sm" data-a="start" data-v="${i}">Start ${esc(w.name)}</button></section>`).join("");
  return `<header class="top"><div class="hello"><span class="eyebrow">Your plan</span><h1>${pl==="home"?"Home":"Gym"}</h1></div>${placeSeg()}</header>
    <p class="muted">Rotate A, B, C. Every workout starts with a ${pl==="home"?"2":"4"} minute warm-up and ends with a short stretch. After each session you tell the app how it felt, and the next one adjusts.</p>
    ${cards}`;
}

function renderProgress(){
  const p=S.profile;
  const ws=S.weights.slice(-16);
  const pts=ws.map(w=>w.kg);
  let spark="";
  if(pts.length>=2){
    const min=Math.min(...pts)-0.5,max=Math.max(...pts)+0.5,W=300,H=56;
    const xy=pts.map((v,i)=>[i/(pts.length-1)*(W-8)+4,H-6-(v-min)/(max-min)*(H-12)]);
    const d=xy.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
    const last=xy[xy.length-1];
    spark=`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Weight trend">
      <path d="${d} L ${last[0]} ${H} L 4 ${H} Z" fill="var(--soft)"/><path d="${d}" fill="none" stroke="var(--muted)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--red)"/></svg>`;
  }
  const first=p.startKg||(S.weights.length?S.weights[0].kg:p.weightKg), cur=S.weights.length?S.weights[S.weights.length-1].kg:p.weightKg;
  const diff=cur-first;
  const b=bmi(cur,p.heightCm);
  const hist=S.sessions.slice().reverse().slice(0,25).map(s=>`<div><span><b>${esc(s.name)}</b><span class="muted small"> · ${s.place==="home"?"Home":"Gym"} · ${s.min} min</span></span><span class="when">${new Date(s.date+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}${s.feel?` <span class="tag">${esc(s.feel)}</span>`:""}</span></div>`).join("");
  const wUnit=isImp()?"lb":"kg";
  return `<header class="top"><div class="hello"><span class="eyebrow">Progress</span><h1>${esc(p.name)}</h1></div></header>
    <section class="card"><div class="card-head"><h3>Weight</h3><span class="small muted">${S.weights.length} check-in${S.weights.length===1?"":"s"}</span></div>
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><span class="num" style="font-size:52px">${isImp()?Math.round(cur*KG_LB):r1(cur)}</span><span class="eyebrow">${wUnit}</span>
      ${Math.abs(diff)>=0.05?`<span class="small muted">${diff===0?"No change":(diff<0?"Down ":"Up ")+fmtW(Math.abs(diff))} since you started</span>`:""}</div>
      ${spark||`<p class="small muted">Weigh in once a week, same day, same time. Your trend line appears after two check-ins.</p>`}
      <div class="row" style="align-items:flex-end">
        <label class="f" style="flex:2">Today's weight<div class="unit"><input class="in" id="w-new" inputmode="decimal" placeholder="${isImp()?Math.round(cur*KG_LB):r1(cur)}"><span>${wUnit}</span></div></label>
        <button class="btn go sm" style="flex:1;min-height:52px" data-a="add-weight">Save</button></div>
      <p class="small muted">BMI now ${r1(b)}, ${bmiWord(b)}. A rough guide only.</p>
    </section>
    <section class="card"><div class="card-head"><h3>Workouts</h3><span class="small muted">${S.sessions.length} total</span></div>
      ${hist?`<div class="hist">${hist}</div>`:`<p class="muted">Your finished workouts land here. Start the first one from Today.</p>`}
    </section>`;
}

function renderMe(){
  const p=S.profile,imp=isImp();
  const wv=imp?Math.round(p.weightKg*KG_LB):r1(p.weightKg);
  const tin=p.heightCm/2.54;let ft=Math.floor(tin/12),inch=Math.round(tin-ft*12);if(inch===12){ft++;inch=0}
  let sync;
  if(cloud.kind==="claude") sync=`<p><span class="ok-dot"></span><b>Saved to your account.</b> Your progress follows you to any device where you open this link signed in.</p>`;
  else if(cloud.kind==="code") sync=`<p><span class="ok-dot ${cloud.status==="ok"?"":"off"}"></span><b>${cloud.status==="ok"?"Backed up to the cloud.":cloud.status==="connecting"?"Connecting to the cloud.":"Saved on this phone."}</b> ${cloud.status==="offline"?"The cloud backup tries again the next time you save.":""}</p>
      ${cloud.code?`<div class="eyebrow">Your sync code</div><div class="code" id="sync-code">${esc(cloud.code)}</div>
      <button class="btn ghost sm" data-a="code-copy">Copy code</button>
      <p class="small muted">To use another phone, open this site there and enter the code. Keep it private: anyone with the code can see your workouts.</p>`:""}
      <details><summary class="linkish" style="cursor:pointer">Have a code from another phone?</summary>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
      <label class="f">Sync code<input class="in txt" id="code-in" autocomplete="off" autocapitalize="characters" placeholder="K7QP-M2XD-9RTA-F4HW"></label>

      ${imp?`<label class="f">Weight<div class="unit"><input class="in" id="me-lb" inputmode="decimal" value="${wv}"><span>lb</span></div></label>
        <div class="row"><label class="f">Height<div class="unit"><input class="in" id="me-ft" inputmode="numeric" value="${ft}"><span>ft</span></div></label><label class="f">&nbsp;<div class="unit"><input class="in" id="me-in" inputmode="numeric" value="${inch}"><span>in</span></div></label></div>`
      :`<div class="row"><label class="f">Weight<div class="unit"><input class="in" id="me-kg" inputmode="decimal" value="${wv}"><span>kg</span></div></label><label class="f">Height<div class="unit"><input class="in" id="me-cm" inputmode="numeric" value="${Math.round(p.heightCm)}"><span>cm</span></div></label></div>`}

      <div class="eyebrow">Level</div>
      <div class="choice">${Object.entries(LEVELS).map(([k,l])=>`<button class="opt" data-a="me-level" data-v="${k}" aria-pressed="${p.level===k}"><b>${l.label}</b><span>${l.sub}</span></button>`).join("")}</div>
      <div class="eyebrow">Workouts per week</div>

      <p class="small muted">It then opens like an app, full screen, one tap away.</p></section>`}

      ${confirmReset?`<div class="confirm"><p><b>Delete all workouts and weigh-ins?</b> This can't be undone.</p><div class="row"><button class="btn ghost sm" data-a="reset-no">Keep my data</button><button class="btn go sm" data-a="reset-yes">Delete everything</button></div></div>`
      :`<p class="small muted">Clears your plan, history and weigh-ins on this device${cloud.kind==="local"?"":" and in your account"}.</p><button class="btn ghost sm" data-a="reset">Reset the app</button>`}
    </section>`;
}

/* ===== Workout player ===== */
let tickH=null, wakeLock=null;
function stepsFor(a){const w=PLAN[a.place].find(x=>x.id===a.wid);return [{k:"warm"},...w.moves.map(id=>({k:"move",id})),{k:"cool"}]}
async function keepAwake(){try{if("wakeLock" in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}}catch(e){}}
function releaseAwake(){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}

function startWorkout(i){
  const pl=S.profile.place,w=workout(pl,i);
  S.active={wid:w.id,place:pl,idx:i,si:0,set:1,phase:"intro",li:0,endAt:0,started:Date.now(),log:[],variant:{}};
  save({localOnly:true});openPlayer();
}
function openPlayer(){const pe=$("#player");pe.hidden=false;document.body.style.overflow="hidden";keepAwake();renderPlayer();startTick()}
function closePlayer(){const pe=$("#player");pe.hidden=true;document.body.style.overflow="";stopTick();releaseAwake();render()}
function startTick(){stopTick();tickH=setInterval(tick,250)}
function stopTick(){clearInterval(tickH);tickH=null}

function ringSVG(frac,color){
  const C=2*Math.PI*44;
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="49" fill="var(--mat)"/>
    <circle cx="50" cy="50" r="44" fill="none" stroke="var(--mat-line)" stroke-width="7"/>
    <circle class="ring-arc" cx="50" cy="50" r="44" fill="none" stroke="var(${color})" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-frac)).toFixed(2)}" transform="rotate(-90 50 50)"/>
    <circle cx="50" cy="50" r="31" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
  </svg>`;
}
function remaining(){return Math.max(0,Math.ceil((S.active.endAt-Date.now())/1000))}

function renderPlayer(){
  const a=S.active;if(!a)return;
  const steps=stepsFor(a), st=steps[a.si];
  const prog=`<div class="p-prog">${steps.map((s,i)=>`<i class="${i<a.si?"done":i===a.si?"now":""}"></i>`).join("")}</div>`;
  const top=`<div class="p-top">${prog}<button class="x" data-a="p-close" aria-label="Pause or end workout">${ICON.x}</button></div>`;
  let body="";
  if(a.phase==="menu"){
    body=`<div class="eyebrow">Paused</div><h2 class="p-name">Take a breather</h2>
      <p class="muted">Your spot is saved. Come back any time from Today.</p>
      <div class="p-foot"><button class="btn go full" data-a="p-back">Keep going</button>
      <button class="btn ghost full" data-a="p-leave">Leave and continue later</button>
      <button class="btn ghost full" data-a="p-end">Finish now and save</button></div>`;
  } else if(a.phase==="finish"){
    const min=Math.max(1,Math.round((Date.now()-a.started)/60000));
    const sets=a.log.length;
    body=`<div class="eyebrow">Workout done</div><h2 class="p-name">Nice work, ${esc(S.profile.name)}.</h2>
      <div class="stats"><div class="stat"><span class="eyebrow">Minutes</span><span class="num">${min}</span></div>
      <div class="stat"><span class="eyebrow">Sets</span><span class="num">${sets}</span></div>
      <div class="stat"><span class="eyebrow">This week</span><span class="num">${weekSessions().length+1}<small>/${S.profile.days}</small></span></div></div>
      <div class="eyebrow">How did that feel?</div>
      <div class="feel">${[["easy","Easy","I had a lot left"],["right","Just right","Hard but doable"],["hard","Too hard","I struggled"]].map(([k,l,s])=>`<button data-a="feel" data-v="${k}" aria-pressed="${a.feel===k}"><b>${l}</b><span>${s}</span></button>`).join("")}</div>
      <p class="small muted">Your next workout adjusts to this.</p>
      <div class="p-foot"><button class="btn go full" data-a="p-save" ${a.feel?"":"disabled"}>Save workout</button></div>`;
  } else if(st.k==="warm"||st.k==="cool"){
    const list=st.k==="warm"?WARM[a.place]:COOL;
    const title=st.k==="warm"?"Warm up":"Cool down";
    const total=list.reduce((s,x)=>s+x[1],0);
    if(a.phase==="intro"){
      body=`<div class="eyebrow">${st.k==="warm"?"First":"Last step"} · ${Math.round(total/60)} min</div><h2 class="p-name">${title}</h2>
        <div class="wlist">${list.map(x=>`<div><span>${esc(x[0])}</span><span class="muted">${fmtSec(x[1])}</span></div>`).join("")}</div>
        <div class="p-foot"><button class="btn go full" data-a="list-go">Start ${title.toLowerCase()}</button>
        <button class="btn ghost full sm" data-a="skip">Skip</button></div>`;
    } else {
      const cur=list[a.li], rem=remaining();
      body=`<div class="eyebrow">${title} · ${a.li+1} of ${list.length}</div><h2 class="p-name">${esc(cur[0])}</h2>
        <div class="ring-wrap">${ringSVG(rem/cur[1],"--yellow")}<div class="ring-c"><span class="num" id="t-num">${rem}</span><span class="eyebrow">seconds</span></div></div>
        <div class="wlist">${list.map((x,i)=>`<div class="${i<a.li?"done":i===a.li?"now":""}"><span>${esc(x[0])}</span><span>${fmtSec(x[1])}</span></div>`).join("")}</div>
        <div class="p-foot"><button class="btn ghost full" data-a="list-next">Next</button></div>`;
    }
  } else {
    const id=st.id,e=EX[id],r=rx(id),v=a.variant[id]||S.variant[id]||"";
    const name=exName(id,v);
    const dots=`<div class="setdots" aria-label="Set ${a.set} of ${r.sets}">${Array.from({length:r.sets},(_,i)=>`<i class="${i+1<a.set?"done":i+1===a.set?"now":""}"></i>`).join("")}<span class="eyebrow" style="margin-left:4px">Set ${Math.min(a.set,r.sets)} of ${r.sets}</span></div>`;
    if(a.phase==="rest"){
      const rem=remaining();const nxt=a.after;let label;
      if(nxt.si!==a.si){const ns=steps[nxt.si];label=ns.k==="move"?`Next move: <b>${esc(exName(ns.id))}</b>`:`Next: <b>Cool down</b>`}
      else label=`Next: <b>set ${nxt.set} of ${r.sets}</b>, ${esc(name)}`;
      body=`<div class="eyebrow">Rest</div><h2 class="p-name">Breathe.</h2>
        <div class="ring-wrap">${ringSVG(rem/a.restLen,"--blue")}<div class="ring-c"><span class="num" id="t-num">${rem}</span><span class="eyebrow">seconds</span></div></div>
        <p class="next-up">${label}</p>
        <div class="p-foot"><div class="row"><button class="btn ghost" data-a="rest-add">+15 s</button><button class="btn go" data-a="rest-skip">Skip rest</button></div></div>`;
    } else {
      const isTime=!!r.sec;
      const timing=a.phase==="timer";
      const rem=timing?remaining():r.sec;
      let load="";
      if(e.load){
        const kg=a.loadKg!=null?a.loadKg:(S.lifts[id]!=null?S.lifts[id]:null);
        const shown=kg==null?"":(isImp()?Math.round(kg*KG_LB):r1(kg));
        load=`<label class="f">Weight used<div class="load"><button class="step" data-a="load-dn" aria-label="Less weight">−</button>
          <div class="unit" style="flex:1"><input class="in" id="p-load" inputmode="decimal" value="${shown}" placeholder="?" style="text-align:center"><span>${isImp()?"lb":"kg"}</span></div>
          <button class="step" data-a="load-up" aria-label="More weight">+</button></div></label>
          ${S.up[id]&&a.set===1?`<p class="hint">Last time felt good. Try ${isImp()?"5 lb":"2.5 kg"} more today.</p>`:kg==null?`<p class="small muted">Pick a weight you can lift for ${r.reps} reps with 2 or 3 left in the tank.</p>`:""}`;
      }
      body=`${dots}<div><div class="eyebrow">${esc(e.m)}</div><h2 class="p-name" style="margin-top:6px">${esc(name)}</h2></div>
        ${timing?`<div class="ring-wrap">${ringSVG(rem/r.sec,"--red")}<div class="ring-c"><span class="num" id="t-num">${rem}</span><span class="eyebrow">seconds${e.per?" each side":""}</span></div></div>`
        :`<div class="p-show"><div class="p-target" style="flex-direction:column;gap:0"><span class="num">${isTime?r.sec:r.reps}</span><span class="u">${isTime?"seconds":"reps"}${e.per?" each side":""}</span></div>
          <div class="fig-card">${figSVG(id,0,'data-fig="'+id+'"')}</div></div>`}
        ${timing?`<div class="fig-card solo">${figSVG(id,0,'data-fig="'+id+'"')}</div>`:""}
        <ul class="cues">${e.cue.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
        <a class="vid" href="${videoURL(id)}" target="_blank" rel="noopener">${ICON.play}Watch a video demo</a>
        ${load}
        ${a.set===1&&!timing?`<div class="swap" role="group" aria-label="Version">
          <button data-a="var" data-v="easy" aria-pressed="${v==="easy"}">Easier</button>
          <button data-a="var" data-v="" aria-pressed="${!v}">Standard</button>
          <button data-a="var" data-v="hard" aria-pressed="${v==="hard"}">Harder</button></div>
          ${r.cap&&v!=="hard"?`<p class="hint">You've maxed out this version. Try Harder.</p>`:""}`:""}
        <div class="p-foot">${isTime?(timing?`<button class="btn ghost full" data-a="timer-done">Done early</button>`:`<button class="btn go full" data-a="timer-go">Start ${fmtSec(r.sec)}</button>`)
          :`<button class="btn go full" data-a="set-done">Done, set ${a.set}</button>`}
          <button class="btn ghost full sm" data-a="skip-move">Skip this move</button></div>`;
    }
  }
  const pe=$("#player");
  pe.innerHTML=`<div class="p-in fade">${top}${body}</div>`;
  animateFigs();
}

function tick(){
  const a=S.active;if(!a||$("#player").hidden)return;
  if(!["list","rest","timer"].includes(a.phase))return;
  const rem=remaining();
  const n=$("#t-num");
  if(n&&n.textContent!==String(rem)){
    n.textContent=rem;
    const arc=$("#player .ring-arc");
    if(arc){const C=2*Math.PI*44;let len=1;
      if(a.phase==="rest")len=a.restLen;
      else if(a.phase==="timer")len=rx(stepsFor(a)[a.si].id).sec;
      else {const st=stepsFor(a)[a.si];len=(st.k==="warm"?WARM[a.place]:COOL)[a.li][1]}
      arc.style.strokeDashoffset=(C*(1-rem/len)).toFixed(2)}
  }
  if(a.endAt&&Date.now()>=a.endAt){a.endAt=0;onTimerEnd();}
}
function flash(){const pe=$("#player");pe.classList.remove("flash");void pe.offsetWidth;pe.classList.add("flash")}
function onTimerEnd(){
  const a=S.active;flash();
  if(a.phase==="list") listNext();
  else if(a.phase==="rest") restEnd();
  else if(a.phase==="timer") completeSet();
}
function listNext(){
  const a=S.active,st=stepsFor(a)[a.si],list=st.k==="warm"?WARM[a.place]:COOL;
  if(a.li<list.length-1){a.li++;a.endAt=Date.now()+list[a.li][1]*1000;a.phase="list"}
  else nextStep();
  save({localOnly:true});renderPlayer();
}
function nextStep(){
  const a=S.active,steps=stepsFor(a);
  a.si++;a.set=1;a.li=0;a.endAt=0;a.loadKg=null;
  if(a.si>=steps.length){a.phase="finish";releaseAwake()}
  else a.phase=steps[a.si].k==="move"?"work":"intro";
}
function readLoad(){const el=$("#p-load");if(!el)return;const v=parseFloat(el.value);if(!isNaN(v)&&v>0){S.active.loadKg=isImp()?v/KG_LB:v}}
function completeSet(){
  const a=S.active,steps=stepsFor(a),id=steps[a.si].id,r=rx(id),e=EX[id];
  readLoad();
  a.log.push({ex:id,set:a.set,reps:r.reps||null,sec:r.sec||null,kg:e.load?(a.loadKg!=null?a.loadKg:S.lifts[id]??null):null,v:a.variant[id]||S.variant[id]||""});
  if(e.load&&a.loadKg!=null)S.lifts[id]=a.loadKg;
  const lastSet=a.set>=r.sets, lastMove=a.si===steps.length-2;
  if(lastSet&&(lastMove||!r.rest)){nextStep()}
  else{
    a.after=lastSet?{si:a.si+1,set:1}:{si:a.si,set:a.set+1};
    a.restLen=lastSet?Math.max(45,Math.round(r.rest*0.75)):r.rest;
    a.phase="rest";a.endAt=Date.now()+a.restLen*1000;
  }
  save({localOnly:true});renderPlayer();
}
function restEnd(){
  const a=S.active,keepLoad=a.loadKg;
  if(a.after.si!==a.si){nextStep()}else{a.set=a.after.set;a.phase="work";a.endAt=0;a.loadKg=keepLoad}
  save({localOnly:true});renderPlayer();
}
function finishSession(){
  const a=S.active,w=PLAN[a.place].find(x=>x.id===a.wid);
  const min=Math.max(1,Math.round((Date.now()-a.started)/60000));
  S.sessions.push({id:Date.now().toString(36),date:today(),wid:a.wid,name:w.name,place:a.place,min,sets:a.log.length,feel:a.feel==="easy"?"Easy":a.feel==="hard"?"Too hard":"Just right"});
  const did=[...new Set(a.log.map(l=>l.ex))];
  did.forEach(id=>{
    const d=a.feel==="easy"?2:a.feel==="hard"?-1:1;
    S.step[id]=clamp((S.step[id]||0)+d,-3,10);
    if(EX[id].load)S.up[id]=S.lifts[id]!=null&&(a.feel==="easy"||(a.feel==="right"&&rx(id).cap));
  });
  Object.entries(a.variant).forEach(([k,v])=>{S.variant[k]=v});
  if(a.idx===(S.next[a.place]||0))S.next[a.place]=((S.next[a.place]||0)+1)%3;
  S.active=null;save();
  closePlayer();tab="today";render();toast("Saved. See you next time, "+S.profile.name+".");
}

/* ===== Events ===== */
function render(){
  const app=$("#app");
  app.innerHTML=S.profile?renderMain():renderOnboarding();
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  const p=S.profile;
  switch(a){
    case "ob-next":{
      readOb();ob.err="";
      if(ob.step===2){const kg=obKg(),cm=obCm();
        if(!(kg>=30&&kg<=300)){ob.err=ob.units==="metric"?"Enter your weight in kg, for example 82.":"Enter your weight in lb, for example 180.";render();return}
        if(!(cm>=120&&cm<=230)){ob.err=ob.units==="metric"?"Enter your height in cm, for example 178.":"Enter your height in feet and inches, for example 5 and 10.";render();return}}
      ob.step=Math.min(4,ob.step+1);render();window.scrollTo(0,0);break}
    case "ob-back":readOb();ob.err="";ob.step=Math.max(0,ob.step-1);render();break;
    case "ob-place":readOb();ob.place=v;render();break;
    case "ob-units":readOb();
      if(v!==ob.units){const kg=obKg(),cm=obCm();ob.units=v;
        if(v==="metric"){ob.kg=kg?String(r1(kg)):"";ob.cm=cm?String(Math.round(cm)):""}
        else{ob.lb=kg?String(Math.round(kg*KG_LB)):"";if(cm){const t=cm/2.54;ob.ft=String(Math.floor(t/12));ob.inch=String(Math.round(t-Math.floor(t/12)*12))}}}
      render();break;
    case "ob-goal":ob.goal=v;render();break;
    case "ob-level":ob.level=v;render();break;
    case "ob-days":ob.days=+v;render();break;
    case "ob-finish":{
      const kg=obKg(),cm=obCm();
      S.profile={name:(ob.name||"Aaron").slice(0,40),weightKg:kg,startKg:kg,heightCm:cm,units:ob.units,goal:ob.goal,level:ob.level,place:ob.place,days:ob.days,since:today()};
      S.weights=[{date:today(),kg}];save();tab="today";render();window.scrollTo(0,0);break}
    case "tab":tab=v;confirmReset=false;render();window.scrollTo(0,0);break;
    case "place":p.place=v;save();render();break;
    case "start":if(S.active&&S.active.phase!=="finish"){toast("Finish or discard your paused workout first.");return}startWorkout(+v);break;
    case "resume":openPlayer();break;
    case "discard":S.active=null;save();render();break;
    case "add-weight":{const el=$("#w-new");let x=parseFloat(el.value);if(isNaN(x)){toast("Type your weight first.");return}
      const kg=isImp()?x/KG_LB:x;if(kg<30||kg>300){toast("That weight looks off. Check the number.");return}
      const t=today();S.weights=S.weights.filter(w=>w.date!==t);S.weights.push({date:t,kg});p.weightKg=kg;save();render();toast("Weight saved.");break}
    case "units":p.units=v;save();render();break;
    case "me-goal":p.goal=v;save();render();break;
    case "me-level":p.level=v;save();render();break;
    case "me-days":p.days=+v;save();render();break;
    case "me-save":{
      const name=$("#me-name").value.trim()||p.name;let kg,cm;
      if(isImp()){kg=parseFloat($("#me-lb").value)/KG_LB;cm=((parseFloat($("#me-ft").value)||0)*12+(parseFloat($("#me-in").value)||0))*2.54}
      else{kg=parseFloat($("#me-kg").value);cm=parseFloat($("#me-cm").value)}
      const er=$("#me-err");
      if(!(kg>=30&&kg<=300)||!(cm>=120&&cm<=230)){er.textContent="Check your weight and height, one of them looks off.";er.hidden=false;return}
      p.name=name.slice(0,40);if(Math.abs(kg-p.weightKg)>0.05){const t=today();S.weights=S.weights.filter(w=>w.date!==t);S.weights.push({date:t,kg})}
      p.weightKg=kg;p.heightCm=cm;save();render();toast("Saved.");break}
    case "reset":confirmReset=true;render();break;
    case "reset-no":confirmReset=false;render();break;
    case "reset-yes":{const keep=S.updatedAt;S=blank();S.updatedAt=keep+1;confirmReset=false;save();ob.step=0;render();window.scrollTo(0,0);break}
    case "code-copy":{const c=cloud.code;const done=()=>toast("Code copied.");
      const fallback=()=>{const el=$("#sync-code");const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast("Code selected. Copy it from here.")};
      try{navigator.clipboard.writeText(c).then(done,fallback)}catch(e){fallback()}break}
    case "code-load":{const er=$("#code-err");b.disabled=true;loadCode($("#code-in").value).then(msg=>{
      if(msg){er.textContent=msg;er.hidden=false;b.disabled=false;return}
      tab="today";render();window.scrollTo(0,0);toast("Welcome back, "+(S.profile?S.profile.name:"")+".")});break}
    // player
    case "p-close":S.active.prev=S.active.phase;S.active.pausedLeft=S.active.endAt?S.active.endAt-Date.now():0;S.active.phase="menu";S.active.endAt=0;save({localOnly:true});renderPlayer();break;
    case "p-back":{const x=S.active;x.phase=x.prev||"work";if(x.pausedLeft>0)x.endAt=Date.now()+x.pausedLeft;else if(["list","rest","timer"].includes(x.phase)){x.endAt=Date.now()+1000}x.pausedLeft=0;save({localOnly:true});renderPlayer();break}
    case "p-leave":{const x=S.active;x.phase=["list","rest","timer"].includes(x.prev)?(x.prev==="list"?"intro":"work"):(x.prev||"work");if(x.phase==="intro")x.li=0;x.endAt=0;save();closePlayer();break}
    case "p-end":S.active.phase="finish";S.active.endAt=0;renderPlayer();break;
    case "list-go":{const x=S.active,st=stepsFor(x)[x.si],list=st.k==="warm"?WARM[x.place]:COOL;x.phase="list";x.li=0;x.endAt=Date.now()+list[0][1]*1000;save({localOnly:true});renderPlayer();break}
    case "list-next":S.active.endAt=0;listNext();break;
    case "skip":nextStep();save({localOnly:true});renderPlayer();break;
    case "skip-move":nextStep();save({localOnly:true});renderPlayer();break;
    case "set-done":completeSet();break;
    case "timer-go":{const x=S.active;readLoad();x.phase="timer";x.endAt=Date.now()+rx(stepsFor(x)[x.si].id).sec*1000;save({localOnly:true});renderPlayer();break}
    case "timer-done":S.active.endAt=0;completeSet();break;
    case "rest-add":S.active.endAt+=15000;S.active.restLen+=15;renderPlayer();break;
    case "rest-skip":S.active.endAt=0;restEnd();break;
    case "var":{readLoad();const x=S.active,id=stepsFor(x)[x.si].id;x.variant[id]=v;renderPlayer();break}
    case "load-up":case "load-dn":{const x=S.active,id=stepsFor(x)[x.si].id;readLoad();
      const stepKg=isImp()?5/KG_LB:2.5;let cur=x.loadKg!=null?x.loadKg:(S.lifts[id]!=null?S.lifts[id]:(isImp()?20/KG_LB:10));
      if(x.loadKg==null&&S.lifts[id]==null){x.loadKg=cur}else{x.loadKg=Math.max(0,cur+(a==="load-up"?stepKg:-stepKg))}
      if(isImp())x.loadKg=Math.round(x.loadKg*KG_LB/5)*5/KG_LB;else x.loadKg=Math.round(x.loadKg/2.5)*2.5;
      renderPlayer();break}
    case "feel":S.active.feel=v;renderPlayer();break;
    case "p-save":finishSession();break;
  }
});
document.addEventListener("input",ev=>{
  if(ev.target.id==="p-load"){const v=parseFloat(ev.target.value);if(!isNaN(v)&&v>0)S.active.loadKg=isImp()?v/KG_LB:v}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.active&&!$("#player").hidden){keepAwake();tick()}});

/* ===== Boot ===== */
render();
if(S.active&&S.active.phase!=="finish"&&S.active.phase!=="menu"){/* show the Continue card on Today */}
initClaudeDb().then(ok=>{if(!ok)initSupabase()});
</script>
